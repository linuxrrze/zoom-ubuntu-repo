name: Backfill versions

# Builds the missing stanzas for all versions listed in versions.txt
# (replaces historical.sh). Versions that can't be downloaded or verified
# are skipped and listed in the job summary.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build missing stanzas
        run: |
          failed=()
          while read -r version; do
            [ -n "$version" ] || continue
            [ -f "stanzas/${version}.control" ] && continue
            scripts/make-stanza.sh "$version" || failed+=("$version")
          done < versions.txt
          {
            echo "### Backfill"
            echo "Stanzas: $(ls stanzas/*.control | wc -l), failed: ${#failed[@]}"
            for v in "${failed[@]}"; do echo "- $v"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add stanzas/
          if git diff --cached --quiet; then
            echo "Nothing new"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Backfill zoom versions"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger workflows, start the update explicitly
          gh workflow run update.yml --ref "$GITHUB_REF_NAME"
