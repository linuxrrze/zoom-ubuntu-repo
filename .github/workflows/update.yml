name: Update repository

# Adds the latest Zoom version (if new), then rebuilds, signs and publishes
# the APT indices to GitHub Pages. The .deb files themselves stay on
# cdn.zoom.us; clients are sent there by mirrors.txt.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['versions.txt', 'stanzas/**', 'scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add new Zoom versions
        run: |
          # On failure still publish what could be added, the last step fails the run
          scripts/add-new-versions.sh || echo "LATEST_FAILED=1" >> "$GITHUB_ENV"
          git add versions.txt stanzas/
          if git diff --cached --quiet; then
            echo "Nothing new"
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- stanzas/ | sed -e 's|stanzas/||' -e 's|\.control$||' | sort -V | paste -sd ' ')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Add zoom ${added:-versions}"
          git push

      - name: Import repository signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$REPO_GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret REPO_GPG_PRIVATE_KEY is not set"
            exit 1
          fi
          echo "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build indices
        run: scripts/build-index.sh public "${{ steps.pages.outputs.base_url }}/" "$KEY_ID"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail if Zoom's latest version couldn't be added
        if: env.LATEST_FAILED == '1'
        run: |
          echo "::error::Zoom's latest version couldn't be added, see the 'Add new Zoom versions' step"
          exit 1
